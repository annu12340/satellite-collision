services:
  - type: web
    name: satellite-collision
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SIM_SEED
        value: "42"
      - key: OPENAI_API_KEY
        sync: false
